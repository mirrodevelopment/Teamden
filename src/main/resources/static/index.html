<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teamden by shed — Team & Work Management</title>
  <link rel="icon" type="image/png" href="/assets/icon.png">
  <link rel="stylesheet" href="/shared/css/reset.css">
  <link rel="stylesheet" href="/shared/css/variables.css">
  <link rel="stylesheet" href="/shared/css/components.css">
  <link rel="stylesheet" href="/shared/css/utilities.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-primary);
    }
    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }
    .splash-logo {
      height: 48px;
      width: auto;
    }
    .splash-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border-color);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <img src="/assets/logo.png" alt="Teamden by shed" class="splash-logo">
    <div class="splash-spinner" role="status" aria-label="Loading"></div>
  </div>

  <script src="/shared/js/api.js"></script>
  <script src="/shared/js/auth.js"></script>
  <script>
    (async () => {
      try {
        const user = await Auth.checkSession();
        if (user) {
          window.location.replace('/pages/dashboard/dashboard.html');
        } else {
          window.location.replace('/pages/login/login.html');
        }
      } catch (e) {
        window.location.replace('/pages/login/login.html');
      }
    })();
  </script>
</body>
</html>
