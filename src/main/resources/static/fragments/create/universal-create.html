<!-- ==============================================================================
     Teamden / Brick — Universal Create & Task Creation Modal
     Path: fragments/create/universal-create.html
     Strictly follows the Brick Neo-Editorial Design Reference (media_1794909754042_81d5fe2f.png)
     ============================================================================== -->
<div class="universal-create-backdrop" id="universal-create-backdrop" aria-hidden="true">
  <div class="universal-create-modal" id="universal-create-modal" role="dialog" aria-modal="true" aria-labelledby="create-modal-title">

    <!-- Modal Header -->
    <header class="create-modal-header">
      <div class="create-header-left">
        <div class="create-breadcrumb">BRICK / UNIVERSAL CREATE</div>
        <h1 class="create-title" id="create-modal-title">create.</h1>
        <p class="create-subtitle">Something new begins here.</p>
      </div>
      <button class="create-close-btn" id="btn-close-create-modal" type="button" aria-label="Close creation modal" title="Close (Esc)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </header>

    <!-- Two-Column Modal Body -->
    <div class="create-modal-body">

      <!-- Left Column: Type Selector Cards (~32%) -->
      <aside class="create-type-sidebar" aria-label="Creation Type Selector">
        <!-- Card 1: Task -->
        <button class="create-type-card type-task active" id="type-card-task" type="button" data-type="TASK" aria-selected="true">
          <div class="type-card-left">
            <div class="type-icon-box task-icon-box">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <line x1="9" y1="6" x2="20" y2="6"></line>
                <line x1="9" y1="12" x2="20" y2="12"></line>
                <line x1="9" y1="18" x2="20" y2="18"></line>
                <circle cx="4" cy="6" r="1.5" fill="currentColor"></circle>
                <circle cx="4" cy="12" r="1.5" fill="currentColor"></circle>
                <circle cx="4" cy="18" r="1.5" fill="currentColor"></circle>
              </svg>
            </div>
            <div class="type-card-text">
              <h3 class="type-card-title">Task</h3>
              <p class="type-card-desc">Something to get done</p>
            </div>
          </div>
          <div class="type-check-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
        </button>

        <!-- Card 2: Project -->
        <button class="create-type-card type-project" id="type-card-project" type="button" data-type="PROJECT" aria-selected="false">
          <div class="type-card-left">
            <div class="type-icon-box project-icon-box">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
              </svg>
            </div>
            <div class="type-card-text">
              <h3 class="type-card-title">Project</h3>
              <p class="type-card-desc">Something to build</p>
            </div>
          </div>
          <div class="type-check-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
        </button>

        <!-- Card 3: Document -->
        <button class="create-type-card type-document" id="type-card-document" type="button" data-type="DOCUMENT" aria-selected="false">
          <div class="type-card-left">
            <div class="type-icon-box document-icon-box">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
              </svg>
            </div>
            <div class="type-card-text">
              <h3 class="type-card-title">Document</h3>
              <p class="type-card-desc">Something to capture</p>
            </div>
          </div>
          <div class="type-check-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
        </button>

        <!-- Card 4: Meeting -->
        <button class="create-type-card type-meeting" id="type-card-meeting" type="button" data-type="MEETING" aria-selected="false">
          <div class="type-card-left">
            <div class="type-icon-box meeting-icon-box">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
                <polyline points="9 16 12 19 16 14"></polyline>
              </svg>
            </div>
            <div class="type-card-text">
              <h3 class="type-card-title">Meeting</h3>
              <p class="type-card-desc">Something to discuss</p>
            </div>
          </div>
          <div class="type-check-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
        </button>
      </aside>

      <!-- Vertical Divider -->
      <div class="create-modal-divider"></div>

      <!-- Right Column: Creation Forms Container (~68%) -->
      <section class="create-form-area">

        <!-- ====================================================================
             1. TASK CREATION FORM (Default Active)
             ==================================================================== -->
        <form class="create-form-panel active" id="form-panel-task" onsubmit="event.preventDefault(); window.UniversalCreate.submitTask();">
          
          <!-- A. NEW TASK Title Input -->
          <div class="form-field-group">
            <label class="form-field-label" for="task-name-input">NEW TASK</label>
            <input type="text" id="task-name-input" class="form-title-input" placeholder="Enter task name" required autofocus autocomplete="off">
          </div>

          <!-- B. PROJECT Searchable Dropdown -->
          <div class="form-field-group">
            <label class="form-field-label" id="task-proj-label">PROJECT</label>
            <div class="custom-select-wrap" id="task-project-select-wrap">
              <button class="custom-select-trigger" id="task-project-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                <div class="select-trigger-content">
                  <svg class="select-trigger-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                  </svg>
                  <span class="select-trigger-text" id="task-project-selected-name">Website Redesign</span>
                </div>
                <svg class="select-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </button>
              <div class="custom-select-dropdown" id="task-project-dropdown" role="listbox">
                <div class="select-search-box">
                  <input type="text" class="select-search-input" id="task-project-search" placeholder="Search projects..." autocomplete="off">
                </div>
                <div class="select-options-list" id="task-project-options">
                  <!-- Populated dynamically via JS -->
                </div>
              </div>
              <input type="hidden" id="task-project-hidden-val">
            </div>
          </div>

          <!-- C. ASSIGNEE & DUE DATE (Side by Side) -->
          <div class="form-fields-row-two">
            <!-- ASSIGNEE -->
            <div class="form-field-group">
              <label class="form-field-label" id="task-assignee-label">ASSIGNEE</label>
              <div class="custom-select-wrap" id="task-assignee-select-wrap">
                <button class="custom-select-trigger" id="task-assignee-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                  <div class="select-trigger-content">
                    <div class="assignee-avatar-badge" id="task-assignee-selected-avatar">PK</div>
                    <span class="select-trigger-text" id="task-assignee-selected-name">Peter K.</span>
                  </div>
                  <svg class="select-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="6 9 12 15 18 9"></polyline>
                  </svg>
                </button>
                <div class="custom-select-dropdown" id="task-assignee-dropdown" role="listbox">
                  <div class="select-options-list" id="task-assignee-options">
                    <!-- Populated dynamically via JS -->
                  </div>
                </div>
                <input type="hidden" id="task-assignee-hidden-val">
              </div>
            </div>

            <!-- DUE DATE -->
            <div class="form-field-group">
              <label class="form-field-label" for="task-due-date-raw">DUE DATE</label>
              <div class="custom-date-wrap" id="task-date-select-wrap">
                <button class="custom-select-trigger" id="task-due-trigger" type="button">
                  <div class="select-trigger-content">
                    <svg class="select-trigger-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                      <line x1="16" y1="2" x2="16" y2="6"></line>
                      <line x1="8" y1="2" x2="8" y2="6"></line>
                      <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                    <span class="select-trigger-text" id="task-due-formatted-display">30 Oct 2026</span>
                  </div>
                  <svg class="select-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="6 9 12 15 18 9"></polyline>
                  </svg>
                </button>
                <input type="date" id="task-due-date-raw" class="invisible-date-picker">
              </div>
            </div>
          </div>

          <!-- D. DESCRIPTION (OPTIONAL) -->
          <div class="form-field-group">
            <label class="form-field-label" for="task-desc-textarea">DESCRIPTION (OPTIONAL)</label>
            <textarea id="task-desc-textarea" class="form-textarea-editorial" rows="3" placeholder="Update mobile navigation structure and interactions based on latest user feedback."></textarea>
          </div>

          <!-- E. LINKED SOURCE CONTEXT CARD -->
          <div class="linked-source-card" id="task-linked-source-card" style="display: none;">
            <div class="linked-source-left">
              <div class="linked-source-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                  <polyline points="14 2 14 8 20 8"></polyline>
                  <line x1="16" y1="13" x2="8" y2="13"></line>
                  <line x1="16" y1="17" x2="8" y2="17"></line>
                </svg>
              </div>
              <div class="linked-source-info">
                <div class="linked-source-title">
                  <span class="linked-prefix">Linked from:</span>
                  <span class="linked-name" id="linked-source-name">Design Review Notes</span>
                </div>
                <div class="linked-source-sub" id="linked-source-sub">Website Redesign &middot; Selected paragraph</div>
              </div>
            </div>
            <button class="linked-source-remove-btn" id="btn-remove-linked-source" type="button" aria-label="Remove linked source" title="Detach reference">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
            <input type="hidden" id="linked-source-id">
          </div>

          <!-- F. EXPANDABLE "MORE DETAILS" PANEL -->
          <div class="more-details-panel" id="task-more-details-panel" style="display: none;">
            <div class="more-details-grid">
              <div class="form-field-group">
                <label class="form-field-label" for="task-column-select">KANBAN COLUMN</label>
                <select id="task-column-select" class="form-select-secondary">
                  <option value="NOW" selected>NOW</option>
                  <option value="NEXT">NEXT</option>
                  <option value="LATER">LATER</option>
                </select>
              </div>

              <div class="form-field-group">
                <label class="form-field-label" for="task-priority-select">PRIORITY</label>
                <select id="task-priority-select" class="form-select-secondary">
                  <option value="HIGH">High</option>
                  <option value="MEDIUM" selected>Medium</option>
                  <option value="LOW">Low</option>
                  <option value="URGENT">Urgent</option>
                </select>
              </div>

              <div class="form-field-group">
                <label class="form-field-label" for="task-status-select">STATUS</label>
                <select id="task-status-select" class="form-select-secondary">
                  <option value="TODO" selected>To Do</option>
                  <option value="IN_PROGRESS">In Progress</option>
                  <option value="IN_REVIEW">In Review</option>
                  <option value="BLOCKED">Blocked</option>
                </select>
              </div>

              <div class="form-field-group">
                <label class="form-field-label" for="task-tag-input">TAG / CATEGORY</label>
                <input type="text" id="task-tag-input" class="form-input-secondary" placeholder="e.g. Design, Mobile">
              </div>
            </div>
          </div>

          <div class="create-form-error" id="task-create-error" style="display: none;"></div>

          <!-- G. BOTTOM ACTION BAR -->
          <div class="create-bottom-bar">
            <button class="btn-more-details" id="btn-toggle-more-details" type="button">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              <span id="more-details-text">More details</span>
            </button>

            <button class="btn-add-another" id="btn-create-add-another" type="button">
              Create &amp; Add Another
            </button>

            <button class="btn-create-submit" id="btn-submit-task" type="submit">
              <span>Create task</span>
              <span class="submit-arrow">&rarr;</span>
            </button>
          </div>

        </form>

        <!-- ====================================================================
             2. PROJECT CREATION FORM
             ==================================================================== -->
        <form class="create-form-panel" id="form-panel-project" style="display: none;" onsubmit="event.preventDefault(); window.UniversalCreate.submitProject();">
          <div class="form-field-group">
            <label class="form-field-label" for="project-name-input">PROJECT NAME</label>
            <input type="text" id="project-name-input" class="form-title-input" placeholder="e.g. Design System V2" required>
          </div>

          <div class="form-field-group">
            <label class="form-field-label" for="project-desc-textarea">DESCRIPTION &amp; GOALS</label>
            <textarea id="project-desc-textarea" class="form-textarea-editorial" rows="3" placeholder="Outline the main objectives, deliverables, and success metrics..."></textarea>
          </div>

          <div class="form-fields-row-two">
            <div class="form-field-group">
              <label class="form-field-label" for="project-status-select">STATUS</label>
              <select id="project-status-select" class="form-select-secondary">
                <option value="ACTIVE" selected>Active</option>
                <option value="PLANNING">Planning</option>
                <option value="ON_HOLD">On Hold</option>
              </select>
            </div>

            <div class="form-field-group">
              <label class="form-field-label" for="project-due-input">TARGET DUE DATE</label>
              <input type="date" id="project-due-input" class="form-input-secondary">
            </div>
          </div>

          <div class="create-form-error" id="project-create-error" style="display: none;"></div>

          <div class="create-bottom-bar">
            <div></div>
            <button class="btn-create-submit peach-submit" id="btn-submit-project" type="submit">
              <span>Create project</span>
              <span class="submit-arrow">&rarr;</span>
            </button>
          </div>
        </form>

        <!-- ====================================================================
             3. DOCUMENT CREATION FORM
             ==================================================================== -->
        <form class="create-form-panel" id="form-panel-document" style="display: none;" onsubmit="event.preventDefault(); window.UniversalCreate.submitDocument();">
          <div class="form-field-group">
            <label class="form-field-label" for="doc-title-input">DOCUMENT TITLE</label>
            <input type="text" id="doc-title-input" class="form-title-input" placeholder="e.g. Design Review Notes" required>
          </div>

          <div class="form-fields-row-two">
            <div class="form-field-group">
              <label class="form-field-label" for="doc-category-select">CATEGORY</label>
              <select id="doc-category-select" class="form-select-secondary">
                <option value="Meeting Notes" selected>Meeting Notes</option>
                <option value="Foundation">Foundation / Plans</option>
                <option value="Reference">Reference / Guidelines</option>
                <option value="Specifications">Specifications</option>
              </select>
            </div>

            <div class="form-field-group">
              <label class="form-field-label" for="doc-project-select">PROJECT</label>
              <select id="doc-project-select" class="form-select-secondary">
                <!-- Sourced dynamically -->
              </select>
            </div>
          </div>

          <div class="form-field-group">
            <label class="form-field-label" for="doc-content-textarea">CONTENT &amp; NOTES</label>
            <textarea id="doc-content-textarea" class="form-textarea-editorial" rows="4" placeholder="Document agenda, decision notes, key discussions, or action items..."></textarea>
          </div>

          <div class="create-form-error" id="doc-create-error" style="display: none;"></div>

          <div class="create-bottom-bar">
            <div></div>
            <button class="btn-create-submit lavender-submit" id="btn-submit-document" type="submit">
              <span>Create document</span>
              <span class="submit-arrow">&rarr;</span>
            </button>
          </div>
        </form>

        <!-- ====================================================================
             4. MEETING CREATION FORM
             ==================================================================== -->
        <form class="create-form-panel" id="form-panel-meeting" style="display: none;" onsubmit="event.preventDefault(); window.UniversalCreate.submitMeeting();">
          <div class="form-field-group">
            <label class="form-field-label" for="meeting-title-input">MEETING TITLE</label>
            <input type="text" id="meeting-title-input" class="form-title-input" placeholder="e.g. Design Review Sync" required>
          </div>

          <div class="form-fields-row-two">
            <div class="form-field-group">
              <label class="form-field-label" for="meeting-date-input">DATE</label>
              <input type="date" id="meeting-date-input" class="form-input-secondary" required>
            </div>

            <div class="form-fields-row-two">
              <div class="form-field-group">
                <label class="form-field-label" for="meeting-start-time">START</label>
                <input type="time" id="meeting-start-time" class="form-input-secondary" value="10:00" required>
              </div>
              <div class="form-field-group">
                <label class="form-field-label" for="meeting-end-time">END</label>
                <input type="time" id="meeting-end-time" class="form-input-secondary" value="11:00" required>
              </div>
            </div>
          </div>

          <div class="form-field-group">
            <label class="form-field-label" for="meeting-project-select">PROJECT</label>
            <select id="meeting-project-select" class="form-select-secondary">
              <!-- Sourced dynamically -->
            </select>
          </div>

          <div class="form-field-group">
            <label class="form-field-label" for="meeting-desc-textarea">AGENDA &amp; PARTICIPANTS</label>
            <textarea id="meeting-desc-textarea" class="form-textarea-editorial" rows="3" placeholder="Discussion topics, links to documents, participant list..."></textarea>
          </div>

          <div class="create-form-error" id="meeting-create-error" style="display: none;"></div>

          <div class="create-bottom-bar">
            <div></div>
            <button class="btn-create-submit green-submit" id="btn-submit-meeting" type="submit">
              <span>Schedule meeting</span>
              <span class="submit-arrow">&rarr;</span>
            </button>
          </div>
        </form>

      </section>
    </div>

  </div>
</div>
