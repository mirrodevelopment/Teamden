<header class="app-topbar" id="app-topbar">
  <!-- Left Side of Topbar (Spans Center Column) -->
  <div class="topbar-center-section">
    <button class="topbar-mobile-toggle" id="mobile-sidebar-toggle" aria-label="Toggle navigation menu" title="Open navigation">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    <div class="topbar-search-box" id="topbar-search-box">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" placeholder="Search for anything..." id="global-search-input" aria-label="Search" autocomplete="off">
      <kbd class="search-kbd" id="search-kbd-shortcut">⌘ K</kbd>
    </div>
  </div>

  <!-- Right Side of Topbar (Spans Right Rail) -->
  <div class="topbar-right-section">
    <!-- Lime + Create ⌵ Button -->
    <div class="create-dropdown-wrapper">
      <button class="btn-create-pill" id="btn-create-pill" aria-haspopup="true" aria-expanded="false" title="Quick Create">
        <span class="create-plus">+</span>
        <span class="create-text">Create</span>
        <svg class="create-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
      <div class="create-menu" id="create-menu" role="menu">
        <a href="#" class="create-menu-item" id="create-action-task">
          <span>✓ New Task</span>
        </a>
        <a href="#" class="create-menu-item" id="create-action-project">
          <span>📁 New Project</span>
        </a>
        <a href="#" class="create-menu-item" id="create-action-update">
          <span>📄 Daily Update</span>
        </a>
      </div>
    </div>

    <!-- Notification, Theme Switcher & Profile with Live Date Underneath -->
    <div class="topbar-right-actions-col">
      <div class="topbar-icons-row">
        <!-- Notification Bell with Red Dot -->
        <button class="topbar-bell-btn" id="notification-btn" aria-label="Notifications" title="Notifications">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span class="bell-red-dot"></span>
        </button>

        <!-- Theme Switcher Button (Near Profile) -->
        <button class="topbar-theme-toggle-btn" id="topbar-theme-toggle" aria-label="Switch Theme" title="Switch Theme">
          <!-- Moon icon shown in light mode -->
          <svg class="theme-icon-moon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <!-- Sun icon shown in dark mode -->
          <svg class="theme-icon-sun" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>

        <!-- User Profile with Avatar & Chevron -->
        <div class="user-menu-wrapper">
          <button class="user-profile-trigger" id="user-profile-btn" aria-haspopup="true" aria-expanded="false" title="User Menu">
            <img src="/assets/bric-icon.png" alt="User Avatar" class="user-avatar-img" id="user-avatar-img" style="display:none;">
            <div class="user-avatar-circle" id="topbar-user-avatar">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="#333333">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
              </svg>
            </div>
            <svg class="user-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>

          <div class="user-dropdown-menu" id="user-dropdown-menu" role="menu">
            <div class="dropdown-header">
              <div class="dropdown-user-name" id="dropdown-user-name">User</div>
              <div class="dropdown-user-role" id="dropdown-user-role">Member</div>
            </div>
            <div class="dropdown-divider"></div>
            <!-- Theme Toggle Option in Profile Menu -->
            <button class="dropdown-item" id="dropdown-theme-toggle">
              <span class="dropdown-icon">🌓</span>
              <span>Switch Theme</span>
            </button>
            <a href="/pages/profile/profile.html" class="dropdown-item">
              <span class="dropdown-icon">👤</span>
              <span>My Profile</span>
            </a>
            <a href="/pages/settings/settings.html" class="dropdown-item">
              <span class="dropdown-icon">⚙️</span>
              <span>Settings</span>
            </a>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item text-danger" id="topbar-logout-btn">
              <span class="dropdown-icon">🚪</span>
              <span>Sign Out</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Live Date Underneath Theme Button, Notification & Profile -->
      <span class="topbar-live-date" id="topbar-date-display">SAT, 31 OCT 2026</span>
    </div>
  </div>
</header>
