<header class="app-topbar" id="app-topbar">
  <!-- Left Side of Topbar (Spans Center Column) -->
  <div class="topbar-center-section">
    <div class="topbar-search-box" id="topbar-search-box">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" placeholder="Search for anything..." id="global-search-input" aria-label="Search" autocomplete="off">
      <kbd class="search-kbd" id="search-kbd-shortcut">⌘ K</kbd>
    </div>
  </div>

  <!-- Right Side of Topbar (Spans Right Rail) -->
  <div class="topbar-right-section">
    <!-- Lime + Create ⌵ Button -->
    <div class="create-dropdown-wrapper">
      <button class="btn-create-pill" id="btn-create-pill" aria-haspopup="true" aria-expanded="false" title="Quick Create">
        <span class="create-plus">+</span>
        <span class="create-text">Create</span>
        <svg class="create-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
      <div class="create-menu" id="create-menu" role="menu">
        <a href="#" class="create-menu-item" id="create-action-task">
          <span>✓ New Task</span>
        </a>
        <a href="#" class="create-menu-item" id="create-action-project">
          <span>📁 New Project</span>
        </a>
        <a href="#" class="create-menu-item" id="create-action-update">
          <span>📄 Daily Update</span>
        </a>
      </div>
    </div>

    <!-- Notification Bell with Red Dot -->
    <button class="topbar-bell-btn" id="notification-btn" aria-label="Notifications" title="Notifications">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      <span class="bell-red-dot"></span>
    </button>

    <!-- User Profile with Avatar & Chevron -->
    <div class="user-menu-wrapper">
      <button class="user-profile-trigger" id="user-profile-btn" aria-haspopup="true" aria-expanded="false" title="User Menu">
        <img src="/assets/bric-icon.png" alt="User Avatar" class="user-avatar-img" id="user-avatar-img" style="display:none;">
        <div class="user-avatar-circle" id="topbar-user-avatar">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#333333">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
          </svg>
        </div>
        <svg class="user-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>

      <div class="user-dropdown-menu" id="user-dropdown-menu" role="menu">
        <div class="dropdown-header">
          <div class="dropdown-user-name" id="dropdown-user-name">User</div>
          <div class="dropdown-user-role" id="dropdown-user-role">Member · Acme Co.</div>
        </div>
        <div class="dropdown-divider"></div>
        <a href="/dev use/index.html" class="dropdown-item">Developer Portal</a>
        <button class="dropdown-item logout-action" id="topbar-logout-btn">Sign Out</button>
      </div>
    </div>
  </div>
</header>
