<header class="app-topbar" id="app-topbar">
  <div class="topbar-left">
    <!-- Mobile toggle -->
    <button class="topbar-btn sidebar-toggle-btn" id="sidebar-toggle-btn" aria-label="Toggle navigation menu" title="Toggle navigation">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>

    <!-- Search Pill with ⌘ K Shortcut -->
    <div class="topbar-search-pill" id="topbar-search-pill">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" placeholder="Search for anything..." id="global-search-input" aria-label="Search" autocomplete="off">
      <kbd class="search-kbd" id="search-kbd-shortcut">⌘ K</kbd>
    </div>
  </div>

  <div class="topbar-right">
    <div class="topbar-actions">
      <!-- Neon + Create Dropdown Button -->
      <div class="create-dropdown-wrapper" id="create-dropdown-wrapper">
        <button class="btn-create-pill" id="btn-create-pill" aria-haspopup="true" aria-expanded="false" title="Quick Create">
          <span class="create-plus">+</span>
          <span class="create-text">Create</span>
          <svg class="create-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <div class="create-menu" id="create-menu" role="menu">
          <a href="#" class="create-menu-item" id="create-action-task">
            <span class="menu-item-icon">✓</span>
            <span>New Task</span>
          </a>
          <a href="#" class="create-menu-item" id="create-action-project">
            <span class="menu-item-icon">📁</span>
            <span>New Project</span>
          </a>
          <a href="#" class="create-menu-item" id="create-action-update">
            <span class="menu-item-icon">📄</span>
            <span>Daily Update</span>
          </a>
        </div>
      </div>

      <!-- Notification Bell with Red Dot -->
      <button class="topbar-icon-btn notification-btn" id="notification-btn" aria-label="Notifications" title="Notifications">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span class="notification-red-dot" id="notification-red-dot"></span>
      </button>

      <!-- User Profile Avatar with Double Letters or Photo -->
      <div class="user-menu-wrapper" id="user-menu-wrapper">
        <button class="user-avatar-btn" id="user-profile-btn" aria-haspopup="true" aria-expanded="false" title="User Menu">
          <div class="topbar-avatar" id="topbar-user-avatar">JD</div>
        </button>

        <div class="user-dropdown-menu" id="user-dropdown-menu" role="menu">
          <div class="dropdown-header">
            <div class="dropdown-user-name" id="dropdown-user-name">User</div>
            <div class="dropdown-user-role" id="dropdown-user-role">Member</div>
          </div>
          <div class="dropdown-divider"></div>
          <a href="/dev use/index.html" class="dropdown-item">Developer Portal</a>
          <button class="dropdown-item logout-action" id="topbar-logout-btn">Sign Out</button>
        </div>
      </div>
    </div>
  </div>
</header>
