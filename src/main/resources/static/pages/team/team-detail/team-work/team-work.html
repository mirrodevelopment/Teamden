<!-- =======================================================================
     Teamden — Team Work Tab Component (team-work.html)
     Path: pages/team/team-detail/team-work/team-work.html
     Pixel-accurate match to Brick Team Work execution register screenshot.
     ======================================================================= -->
<div class="tw-split-layout" id="team-work-root">

  <!-- =====================================================================
       MAIN WORK REGISTER COLUMN (Left ~73%)
       ===================================================================== -->
  <div class="tw-main-col">

    <!-- Section 01: Team Execution Header Row -->
    <div class="tw-exec-header-row">
      <div class="tw-exec-left">
        <div class="tw-exec-eyebrow">
          <span class="tw-eyebrow-num">01</span>
          <span class="tw-eyebrow-sep">/</span>
          <span class="tw-eyebrow-label">TEAM EXECUTION</span>
        </div>
        <h2 class="tw-exec-title">Work in motion<span class="tw-title-dot">.</span></h2>
      </div>

      <button type="button" class="tw-new-task-btn" id="tw-new-task-btn" title="Create a new task">
        <span class="tw-plus-icon">+</span>
        <span>New task</span>
      </button>
    </div>

    <!-- Toolbar & Filters Row -->
    <div class="tw-toolbar-row">
      <div class="tw-toolbar-left">
        <!-- Primary View Pills -->
        <div class="tw-view-pills" role="group" aria-label="Task scope">
          <button type="button" class="tw-view-pill active" id="tw-pill-all" data-scope="all" aria-pressed="true">
            All team work
          </button>
          <button type="button" class="tw-view-pill" id="tw-pill-my" data-scope="my" aria-pressed="false">
            My work
          </button>
        </div>

        <!-- Filter Dropdowns -->
        <div class="tw-filter-dropdown-wrap">
          <button type="button" class="tw-dropdown-btn" id="tw-filter-project-btn" aria-haspopup="true" aria-expanded="false">
            <span id="tw-filter-project-label">By project</span>
            <span class="tw-chevron">&#8964;</span>
          </button>
          <div class="tw-dropdown-menu" id="tw-menu-project" role="menu">
            <button type="button" class="tw-dropdown-item active" data-val="all">All Projects</button>
          </div>
        </div>

        <div class="tw-filter-dropdown-wrap">
          <button type="button" class="tw-dropdown-btn" id="tw-filter-status-btn" aria-haspopup="true" aria-expanded="false">
            <span id="tw-filter-status-label">By status</span>
            <span class="tw-chevron">&#8964;</span>
          </button>
          <div class="tw-dropdown-menu" id="tw-menu-status" role="menu">
            <button type="button" class="tw-dropdown-item active" data-val="all">All Statuses</button>
            <button type="button" class="tw-dropdown-item" data-val="IN_PROGRESS">In Progress</button>
            <button type="button" class="tw-dropdown-item" data-val="IN_REVIEW">In Review</button>
            <button type="button" class="tw-dropdown-item" data-val="TODO">To Do</button>
            <button type="button" class="tw-dropdown-item" data-val="COMPLETED">Completed</button>
          </div>
        </div>

        <div class="tw-filter-dropdown-wrap">
          <button type="button" class="tw-dropdown-btn" id="tw-filter-owner-btn" aria-haspopup="true" aria-expanded="false">
            <span id="tw-filter-owner-label">By owner</span>
            <span class="tw-chevron">&#8964;</span>
          </button>
          <div class="tw-dropdown-menu" id="tw-menu-owner" role="menu">
            <button type="button" class="tw-dropdown-item active" data-val="all">All Owners</button>
          </div>
        </div>
      </div>

      <!-- Action Icons (Search, Filter, Sort) -->
      <div class="tw-toolbar-right">
        <!-- Search Input & Button -->
        <div class="tw-search-wrap" id="tw-search-wrap">
          <input type="text" class="tw-search-input" id="tw-search-input" placeholder="Search tasks..." aria-label="Search tasks">
          <button type="button" class="tw-tool-icon-btn" id="tw-search-toggle-btn" title="Search tasks" aria-label="Search tasks">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
        </div>

        <button type="button" class="tw-tool-icon-btn" id="tw-sliders-btn" title="Advanced filters" aria-label="Advanced filters">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="4" y1="21" x2="4" y2="14"></line>
            <line x1="4" y1="10" x2="4" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12" y2="3"></line>
            <line x1="20" y1="21" x2="20" y2="16"></line>
            <line x1="20" y1="12" x2="20" y2="3"></line>
            <line x1="1" y1="14" x2="7" y2="14"></line>
            <line x1="9" y1="8" x2="15" y2="8"></line>
            <line x1="17" y1="16" x2="23" y2="16"></line>
          </svg>
        </button>

        <button type="button" class="tw-tool-icon-btn" id="tw-sort-btn" title="Sort order" aria-label="Sort order">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <polyline points="19 12 12 19 5 12"></polyline>
          </svg>
        </button>
      </div>
    </div>

    <!-- Team Task Register Card -->
    <div class="tw-register-card" id="tw-register-card">

      <!-- Group 1: IN PROGRESS (Expanded by default) -->
      <div class="tw-group tw-group--expanded" id="group-in-progress" data-group="IN_PROGRESS">
        <button type="button" class="tw-group-header" aria-expanded="true">
          <span class="tw-group-header-left">
            <span class="tw-group-dot tw-group-dot--blue"></span>
            <span class="tw-group-title">IN PROGRESS</span>
            <span class="tw-group-count" id="count-in-progress">00</span>
          </span>
          <span class="tw-group-chevron">&#8963;</span>
        </button>

        <div class="tw-group-body tw-group-body--blue" id="body-in-progress">
          <!-- Tasks injected dynamically via JS -->
        </div>
      </div>

      <!-- Group 2: IN REVIEW (Collapsed by default) -->
      <div class="tw-group" id="group-in-review" data-group="IN_REVIEW">
        <button type="button" class="tw-group-header" aria-expanded="false">
          <span class="tw-group-header-left">
            <span class="tw-group-dot tw-group-dot--amber"></span>
            <span class="tw-group-title">IN REVIEW</span>
            <span class="tw-group-count" id="count-in-review">00</span>
          </span>
          <span class="tw-group-chevron">&#8964;</span>
        </button>

        <div class="tw-group-body tw-hidden" id="body-in-review">
          <!-- Tasks injected dynamically via JS -->
        </div>
      </div>

      <!-- Group 3: TO DO (Collapsed by default) -->
      <div class="tw-group" id="group-todo" data-group="TODO">
        <button type="button" class="tw-group-header" aria-expanded="false">
          <span class="tw-group-header-left">
            <span class="tw-group-dot tw-group-dot--gray"></span>
            <span class="tw-group-title">TO DO</span>
            <span class="tw-group-count" id="count-todo">00</span>
          </span>
          <span class="tw-group-chevron">&#8964;</span>
        </button>

        <div class="tw-group-body tw-hidden" id="body-todo">
          <!-- Tasks injected dynamically via JS -->
        </div>
      </div>

      <!-- Group 4: COMPLETED (Collapsed by default) -->
      <div class="tw-group" id="group-completed" data-group="COMPLETED">
        <button type="button" class="tw-group-header" aria-expanded="false">
          <span class="tw-group-header-left">
            <span class="tw-group-dot tw-group-dot--green"></span>
            <span class="tw-group-title">COMPLETED</span>
            <span class="tw-group-count" id="count-completed">00</span>
          </span>
          <span class="tw-group-chevron">&#8964;</span>
        </button>

        <div class="tw-group-body tw-hidden" id="body-completed">
          <!-- Tasks injected dynamically via JS -->
        </div>
      </div>

    </div><!-- /.tw-register-card -->

  </div><!-- /.tw-main-col -->

  <!-- =====================================================================
       RIGHT INFORMATION SIDEBAR (~27%)
       ===================================================================== -->
  <aside class="tw-right-rail" aria-label="Review Desk, Handoff Queue, and Work by Owner">

    <!-- Card 1: Review Desk (Pale Beige Card) -->
    <div class="tw-rail-card--beige" id="tw-review-desk-card">
      <div class="tw-rail-head">
        <span class="tw-rail-label">03 / REVIEW DESK</span>
        <span class="tw-rail-badge">02 PENDING</span>
      </div>
      <h3 class="tw-rail-title">Needs review<span class="tw-title-dot">.</span></h3>

      <div class="tw-reviews-list" id="tw-reviews-list">
        <div class="tw-empty-msg">
          No items awaiting review.
        </div>
      </div>

      <div class="tw-rail-bottom-link-wrap">
        <button type="button" class="tw-rail-link-btn" id="tw-view-all-reviews-btn">
          <span>View all reviews</span>
          <span class="tw-link-arrow">&#8594;</span>
        </button>
      </div>
    </div>

    <!-- Card 2: Handoff Queue (Pale Green Card) -->
    <div class="tw-rail-card--green" id="tw-handoff-queue-card">
      <div class="tw-rail-head">
        <span class="tw-rail-label">04 / HANDOFF QUEUE</span>
        <span class="tw-rail-badge">01 READY</span>
      </div>
      <h3 class="tw-rail-title">Ready to move<span class="tw-title-dot">.</span></h3>

      <!-- Team Transition Flow Badges -->
      <div class="tw-handoff-flow-row">
        <span class="tw-flow-badge tw-flow-badge--lavender">DESIGN</span>
        <span class="tw-flow-arrow">&#8594;</span>
        <span class="tw-flow-badge tw-flow-badge--blue">ENGINEERING</span>
      </div>

      <div class="tw-handoff-body" id="tw-handoff-body">
        <div class="tw-empty-msg">
          No active handoffs in queue.
        </div>
      </div>
    </div>

    <!-- Card 3: Work by Owner (Bordered Card) -->
    <div class="tw-rail-card" id="tw-work-owner-card">
      <div class="tw-rail-head">
        <span class="tw-rail-label">02 / WORK BY OWNER</span>
        <button type="button" class="tw-rail-head-link" id="tw-owner-view-all">View all &#8594;</button>
      </div>

      <div class="tw-owners-list" id="tw-owners-list">
        <div class="tw-empty-msg">
          No assigned owners.
        </div>
      </div>
    </div>

  </aside><!-- /.tw-right-rail -->

</div><!-- /.tw-split-layout -->

<!-- Slide-out Task Details Drawer -->
<div class="tw-drawer-backdrop" id="tw-drawer-backdrop" aria-hidden="true"></div>
<div class="tw-drawer" id="tw-drawer" role="dialog" aria-modal="true" aria-labelledby="tw-drawer-title">
  <div class="tw-drawer-head">
    <div class="tw-drawer-head-meta">
      <span class="tw-drawer-project" id="tw-drawer-project">Website Redesign</span>
      <span class="tw-drawer-id" id="tw-drawer-id">TASK 014</span>
    </div>
    <button type="button" class="tw-drawer-close-btn" id="tw-drawer-close" aria-label="Close drawer">&times;</button>
  </div>

  <div class="tw-drawer-content" id="tw-drawer-content">
    <!-- Injected dynamically -->
  </div>
</div>
