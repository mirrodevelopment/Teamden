<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>brick — create project.</title>
  <link rel="icon" type="image/png" href="/assets/bric-icon.png" data-company="icon">
  <script>
    (function () {
      var t = localStorage.getItem('teamden-theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
      if (localStorage.getItem('teamden-sidebar-collapsed') === 'true') {
        document.documentElement.classList.add('sidebar-collapsed');
      }
    })();
  </script>

  <!-- Typography & Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Inter+Tight:wght@400;500;600;700;800;900&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600;1,700&family=Unbounded:wght@800;900&display=swap">
  <link rel="stylesheet" href="/fragments/fonts/fonts.css?v=12">
  <link rel="stylesheet" href="/fragments/theme/theme.css?v=15">
  <link rel="stylesheet" href="/fragments/theme/reset.css">

  <!-- Modular Fragment Styles -->
  <link rel="stylesheet" href="/fragments/sidebar/sidebar.css?v=12">
  <link rel="stylesheet" href="/fragments/navbar/navbar.css?v=12">

  <!-- Page Specific Styles -->
  <link rel="stylesheet" href="create-project.css?v=1">
</head>
<body class="dashboard-body project-create-body">

  <div class="dash-master-wrapper">
    <!-- Modular Sidebar Mount -->
    <div id="sidebar-mount" class="sidebar-mount-area"></div>

    <!-- Main Content Area -->
    <div class="dash-main-area">
      <!-- Modular Topbar Mount -->
      <div id="navbar-mount" class="navbar-mount-area"></div>

      <!-- Main Canvas -->
      <main class="create-project-canvas" id="create-project-canvas">
        <div class="create-project-container">

          <!-- Header / Breadcrumbs -->
          <header class="create-project-head">
            <div class="project-head-left">
              <div class="project-breadcrumb">
                <a href="/pages/dashboard/dashboard.html" class="project-crumb-link">YOUR WORKSPACE</a>
                <span class="project-crumb-sep">/</span>
                <a href="/pages/projects/projects.html" class="project-crumb-link">PROJECTS</a>
                <span class="project-crumb-sep">/</span>
                <span class="project-crumb-sub">NEW PROJECT</span>
              </div>
              <div class="project-title-row">
                <h1 class="project-title-main">CREATE PROJECT<span class="title-square-dot"></span></h1>
                <span class="project-badge-initiative">INITIATIVE / WORKSPACE</span>
              </div>
            </div>

            <div class="project-head-right">
              <a href="/pages/projects/projects.html" class="project-back-link" title="Cancel & Return">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
                <span>Back to Projects</span>
              </a>
            </div>
          </header>

          <!-- Project Form Card -->
          <div class="create-card">
            <form id="standalone-project-form" onsubmit="event.preventDefault(); window.submitStandaloneProject();">
              
              <!-- Project Name -->
              <div class="form-group">
                <label for="project-name" class="form-label">
                  PROJECT NAME <span class="required-star">*</span>
                </label>
                <input type="text" id="project-name" class="form-input form-input-lg" placeholder="e.g. Mobile Design System &amp; Design Token Sync" required autofocus autocomplete="off">
              </div>

              <!-- Description -->
              <div class="form-group">
                <label for="project-desc" class="form-label">DESCRIPTION &amp; SCOPE</label>
                <textarea id="project-desc" class="form-textarea" rows="4" placeholder="Brief outline of project scope, core objectives, deliverables, and target outcomes..."></textarea>
              </div>

              <!-- Row: Owner & Type -->
              <div class="form-row-two">
                <div class="form-group">
                  <label for="project-owner" class="form-label">PROJECT LEAD / OWNER</label>
                  <select id="project-owner" class="form-select">
                    <option value="">Loading workspace members...</option>
                  </select>
                </div>

                <div class="form-group">
                  <label for="project-type" class="form-label">PROJECT TYPE / TRACK</label>
                  <select id="project-type" class="form-select">
                    <option value="General" selected>General</option>
                    <option value="Design &amp; UX">Design &amp; UX</option>
                    <option value="Engineering">Engineering</option>
                    <option value="Marketing">Marketing</option>
                    <option value="Product Roadmap">Product Roadmap</option>
                  </select>
                </div>
              </div>

              <!-- Row: Status, Priority, Health -->
              <div class="form-row-three">
                <div class="form-group">
                  <label for="project-status" class="form-label">INITIAL STATUS</label>
                  <select id="project-status" class="form-select">
                    <option value="ACTIVE" selected>ACTIVE (In Progress)</option>
                    <option value="PLANNING">PLANNING (Scoping)</option>
                    <option value="ON_HOLD">ON HOLD (Paused)</option>
                    <option value="COMPLETED">COMPLETED (Delivered)</option>
                  </select>
                </div>

                <div class="form-group">
                  <label for="project-priority" class="form-label">PRIORITY</label>
                  <select id="project-priority" class="form-select">
                    <option value="HIGH">High Priority</option>
                    <option value="MEDIUM" selected>Medium Priority</option>
                    <option value="LOW">Low Priority</option>
                  </select>
                </div>

                <div class="form-group">
                  <label for="project-health" class="form-label">HEALTH INDICATOR</label>
                  <select id="project-health" class="form-select">
                    <option value="ON_TRACK" selected>On Track (Green)</option>
                    <option value="AT_RISK">At Risk (Amber)</option>
                    <option value="DELAYED">Delayed (Red)</option>
                  </select>
                </div>
              </div>

              <!-- Row: Timeline Dates -->
              <div class="form-row-two">
                <div class="form-group">
                  <label for="project-start" class="form-label">START DATE</label>
                  <input type="date" id="project-start" class="form-input">
                </div>

                <div class="form-group">
                  <label for="project-due" class="form-label">TARGET DUE DATE</label>
                  <input type="date" id="project-due" class="form-input">
                </div>
              </div>

              <!-- Error Alert Box -->
              <div id="form-error-banner" class="form-error-banner" style="display: none;"></div>

              <!-- Footer Actions -->
              <div class="form-actions-row">
                <a href="/pages/projects/projects.html" class="btn-cancel">Cancel</a>
                <button type="submit" id="btn-save-project" class="btn-primary">
                  <span>Create Project &amp; Return</span>
                  <span class="btn-arrow">→</span>
                </button>
              </div>

            </form>
          </div>

        </div>
      </main>
    </div>
  </div>

  <!-- Shared Utility Scripts -->
  <script src="/fragments/company-data/company-data.js?v=2"></script>
  <script src="/shared/js/api.js?v=2"></script>
  <script src="/shared/js/auth.js?v=2"></script>
  <script src="/fragments/sidebar/sidebar.js?v=12"></script>
  <script src="/fragments/navbar/navbar.js?v=12"></script>

  <!-- Page Logic -->
  <script src="create-project.js?v=1"></script>
</body>
</html>
