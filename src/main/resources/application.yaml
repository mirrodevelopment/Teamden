spring:
  application:
    name: teamden

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/teamden}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:crazy@8}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 2h
      cookie:
        http-only: true
        secure: false # set to true in production over HTTPS
        same-site: lax
        name: TEAMDEN_SESSION

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.shed.teamden: DEBUG
    org.springframework.security: INFO
